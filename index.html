<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Level Up!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!--
  Drop your MP3 in the same folder and name it: birthday.mp3
-->
    <audio id="bday-audio" src="birthday.mp3" preload="auto"></audio>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500&family=Vazirmatn:wght@400;500;600&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        height: 100%;
        background: #0d001a;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        background: linear-gradient(
          160deg,
          #0d001a 0%,
          #1a0030 40%,
          #2a0010 100%
        );
        overflow-x: hidden;
        overflow-y: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(
            1px 1px at 12% 18%,
            rgba(255, 255, 255, 0.7) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 35% 7%,
            rgba(255, 255, 255, 0.5) 0%,
            transparent 100%
          ),
          radial-gradient(
            1.5px 1.5px at 58% 33%,
            rgba(255, 255, 255, 0.6) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 78% 14%,
            rgba(255, 255, 255, 0.4) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 91% 48%,
            rgba(255, 255, 255, 0.5) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 4% 68%,
            rgba(255, 255, 255, 0.4) 0%,
            transparent 100%
          ),
          radial-gradient(
            1.5px 1.5px at 22% 83%,
            rgba(255, 255, 255, 0.6) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 68% 73%,
            rgba(255, 255, 255, 0.3) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 48% 53%,
            rgba(255, 255, 255, 0.5) 0%,
            transparent 100%
          ),
          radial-gradient(
            1px 1px at 86% 86%,
            rgba(255, 255, 255, 0.4) 0%,
            transparent 100%
          );
        pointer-events: none;
        z-index: 0;
      }

      /* cake stays fixed, centred, ABOVE everything (z:20) */
      #cake-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 20;
        pointer-events: auto;
        transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #cake-canvas.shifted {
        transform: translateX(22%);
      }

      /* blow ui */
      #blow-ui {
        position: fixed;
        bottom: 9%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 100;
      }
      #instructions {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: 19px;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 160, 80, 0.6);
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        padding: 11px 26px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        animation: softpulse 2.4s ease-in-out infinite;
        text-align: center;
        white-space: nowrap;
      }
      #start-mic-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 200, 100, 0.5);
        color: rgba(255, 230, 180, 0.95);
        font-family: "Inter", sans-serif;
        font-size: 14px;
        padding: 10px 26px;
        border-radius: 30px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.15s;
      }
      #start-mic-btn:hover {
        background: rgba(255, 200, 100, 0.18);
        transform: translateY(-1px);
      }
      #start-mic-btn.hidden {
        display: none;
      }
      #blow-meter-wrap {
        width: 200px;
        height: 8px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        overflow: hidden;
        display: none;
      }
      #blow-meter-wrap.visible {
        display: block;
      }
      #blow-meter-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ffb347, #ff5e62);
        border-radius: 6px;
        transition: width 0.07s ease;
      }

      /* candle counter badge */
      #candle-count {
        font-family: "Inter", sans-serif;
        font-size: 13px;
        color: rgba(255, 220, 140, 0.9);
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
        padding: 5px 16px;
        border-radius: 20px;
        border: 1px solid rgba(255, 200, 80, 0.25);
        display: none;
      }
      #candle-count.visible {
        display: block;
      }

      @keyframes softpulse {
        0%,
        100% {
          opacity: 0.9;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.03);
        }
      }

      /* confetti */
      #confetti-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 30;
        pointer-events: none;
        display: none;
      }

      /* balloons — float gently in the background around the character */
      #balloons {
        position: fixed;
        inset: 0;
        z-index: 25;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.2s ease;
      }
      #balloons.visible {
        opacity: 1;
      }
      .balloon {
        position: absolute;
        display: block;
        animation: balloon-float 5s ease-in-out infinite;
      }
      .balloon--1 {
        width: 78px;
        top: 8%;
        left: 8%;
        animation-duration: 5.4s;
        animation-delay: 0s;
      }
      .balloon--2 {
        width: 62px;
        top: 14%;
        right: 10%;
        animation-duration: 4.6s;
        animation-delay: 0.6s;
      }
      .balloon--3 {
        width: 56px;
        top: 46%;
        left: 4%;
        animation-duration: 5.8s;
        animation-delay: 1.1s;
      }
      .balloon--4 {
        width: 70px;
        top: 40%;
        right: 5%;
        animation-duration: 5s;
        animation-delay: 0.3s;
      }
      .balloon--5 {
        width: 50px;
        top: 74%;
        left: 12%;
        animation-duration: 4.8s;
        animation-delay: 1.6s;
      }
      .balloon--6 {
        width: 64px;
        top: 70%;
        right: 14%;
        animation-duration: 5.2s;
        animation-delay: 0.9s;
      }
      .balloon--7 {
        width: 46px;
        top: 26%;
        left: 22%;
        animation-duration: 4.4s;
        animation-delay: 2s;
      }
      @keyframes balloon-float {
        0%,
        100% {
          transform: translateY(0) rotate(-3deg);
        }
        50% {
          transform: translateY(-24px) rotate(3deg);
        }
      }

      /* character wrap — fades in centred, z:40 so it's above everything */
      #char-wrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0px;
        z-index: 40;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.82);
        transition:
          opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #char-wrap.visible {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      /* char-label — a little cloud floating above the guy's head */
      #char-label {
        position: relative;
        font-family: "Vazirmatn", "Playfair Display", serif;
        font-style: normal;
        font-weight: 500;
        font-size: 20px;
        color: #3a2f22;
        background: #fdfbf5;
        padding: 16px 34px;
        border-radius: 999px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        margin-bottom: 46px;
        white-space: normal;
        text-align: center;
        max-width: 100%;
        opacity: 0;
        transition: opacity 0.7s ease 0.5s;
      }
      /* puffy bumps along the top of the cloud */
      #char-label::before {
        content: "";
        position: absolute;
        top: -16px;
        left: 24px;
        width: 34px;
        height: 34px;
        background: #fdfbf5;
        border-radius: 50%;
        box-shadow:
          28px -8px 0 -3px #fdfbf5,
          56px 3px 0 -8px #fdfbf5;
      }
      /* small trailing bubbles, like a thought-bubble tail down toward his head */
      #char-label::after {
        content: "";
        position: absolute;
        bottom: -20px;
        left: 44%;
        width: 15px;
        height: 15px;
        background: #fdfbf5;
        border-radius: 50%;
        box-shadow: -16px 15px 0 -4px #fdfbf5;
      }
      #char-wrap.visible #char-label {
        opacity: 1;
      }

      /* =================== SVG GUY =================== */
      #svg-guy-wrap {
        width: 380px;
        height: 380px;
        position: relative;
        flex-shrink: 0;
        overflow: hidden;
        border-radius: 24px;
        box-shadow:
          0 0 0 2px rgba(255, 200, 100, 0.2),
          0 20px 60px rgba(0, 0, 0, 0.5);
      }
      #svg-guy-wrap svg {
        width: 100%;
        height: 100%;
      }

      /* The hover-state layers are always visible since we want the full look */
      #svg-guy-wrap .guy__hover {
        display: block !important;
      }
      #svg-guy-wrap .guy__hover--reverse {
        display: none !important;
      }

      /* ---- DANCING ---- */
      /* animate only the character inside the frame — the card itself
         (border, shadow, rounded corners) stays perfectly still */
      #svg-guy-wrap.dancing .guy-figure {
        animation: svg-body-bounce 0.52s ease-in-out infinite alternate;
        transform-origin: center bottom;
      }
      @keyframes svg-body-bounce {
        0% {
          transform: translateY(0px) rotate(-3deg) scaleY(1) scaleX(1);
        }
        45% {
          transform: translateY(-16px) rotate(2.5deg) scaleY(1.05) scaleX(0.96);
        }
        100% {
          transform: translateY(-8px) rotate(-1.5deg) scaleY(0.97) scaleX(1.02);
        }
      }

      /* wave the hand continuously */
      #svg-guy-wrap.dancing .hand {
        animation: svg-wave 1.1s ease-in-out infinite;
        transform-origin: 139px 413px;
      }
      @keyframes svg-wave {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-20deg);
        }
        55% {
          transform: rotate(8deg);
        }
        80% {
          transform: rotate(-12deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      /* mustache left side swings */
      #svg-guy-wrap.dancing .mustache-left {
        animation: svg-stache-left 1.4s cubic-bezier(0.64, -0.5, 0.28, 1.36)
          infinite;
        transform-origin: 240px 270px;
      }
      #svg-guy-wrap.dancing .mustache-right {
        animation: svg-stache-right 1.4s cubic-bezier(0.64, -0.5, 0.28, 1.36)
          infinite;
        transform-origin: 262px 270px;
      }
      @keyframes svg-stache-left {
        0%,
        100% {
          transform: rotate(0deg);
        }
        20% {
          transform: rotate(-14deg);
        }
        50% {
          transform: rotate(0deg);
        }
        70% {
          transform: rotate(-8deg);
        }
      }
      @keyframes svg-stache-right {
        0%,
        100% {
          transform: rotate(0deg);
        }
        20% {
          transform: rotate(14deg);
        }
        50% {
          transform: rotate(0deg);
        }
        70% {
          transform: rotate(8deg);
        }
      }

      /* sunglasses bounce */
      #svg-guy-wrap.dancing .sunglasses {
        animation: svg-glasses 0.52s ease-in-out infinite alternate;
        transform-origin: 250px 215px;
      }
      @keyframes svg-glasses {
        0% {
          transform: translateY(0px) rotate(-1deg);
        }
        100% {
          transform: translateY(-4px) rotate(1deg);
        }
      }

      /* background shapes stay static — only the character moves */

      /* eyes blink */
      #svg-guy-wrap.dancing .eye {
        animation: svg-blink 2.8s ease-in-out infinite;
        transform-origin: 250px 208px;
      }
      @keyframes svg-blink {
        0%,
        90%,
        100% {
          transform: scaleY(1);
        }
        94% {
          transform: scaleY(0.08);
        }
      }

      /* music chip */
      #music-chip {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 200, 100, 0.3);
        border-radius: 40px;
        padding: 10px 18px 10px 12px;
        display: none;
        align-items: center;
        gap: 10px;
        z-index: 200;
        font-family: "Inter", sans-serif;
        font-size: 13px;
      }
      #music-chip.show {
        display: flex;
      }
      #music-disc {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: conic-gradient(#ff9a3c, #ff4f7b, #a855f7, #3b82f6, #ff9a3c);
        animation: spin 2.5s linear infinite;
        flex-shrink: 0;
        position: relative;
      }
      #music-disc::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #111;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #music-label {
        color: rgba(255, 230, 180, 0.9);
      }

      @media (max-width: 768px) {
        .cartoon {
          width: 150px;
          height: 150px;
        }
        #svg-guy-wrap {
          width: 200px;
          height: 200px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cartoon.dancing,
        .cartoon.dancing::before,
        .cartoon.dancing::after {
          animation: none;
        }
      }
    </style>
  </head>

      <div id="char-label">ناز سبیل و مرام و معرفتت مسیحا</div>
      <div
        id="svg-guy-wrap"
        role="img"
        aria-label="Cool guy with sunglasses and mustache dancing"
      >
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient
              id="g2_green"
              x1="250"

            >

            <linearGradient

          <!-- base green background -->

          <!-- hover background: bright green with geometric shapes (always shown) -->

            <rect width="500" height="500" fill="#85DE76" />

            <rect

              x="439.33"
              y="128.38"
              width="12"
              height="67.73"
              transform="translate(100.32 487.21) rotate(-63.3)"
              fill="#65BA52"
            />
            <polygon
              points="395.2 34.96 396.73 70.34 365.32 53.97 395.2 34.96"

            />
            <polygon
              points="34.01 446.19 69.34 443.81 53.74 475.61 34.01 446.19"
              fill="#fff"

          </g>

          <!-- everything below is the character himself — this is the ONLY
               part that moves when dancing; the background stays put -->
          <g class="guy-figure">

    <script>
      /* ============================================================
   THREE.JS CAKE
============================================================ */
      let scene, camera, renderer, cake;
      let candleMeshes =
        []; /* {stick,flameOut,flameIn,glow,light} per candle */
      let cakeBlown = false;

      /* mic */
      let audioCtx,
        analyser,
        micStream,
        micActive = false;
      let blowHoldFrames = 0;

      /* progressive blow state */
      const TOTAL_CANDLES = 5;
      let candlesLeft = TOTAL_CANDLES;
      /* threshold rises with each candle: first=0.13, last=0.21 */
      function blowThreshold() {
        return 0.13 + (TOTAL_CANDLES - candlesLeft) * 0.02;
      }
      const HOLD_NEEDED = 10;

      function initCake() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          65,
          innerWidth / innerHeight,
          0.1,
          1000,
        );
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        document.getElementById("cake-canvas").appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffeedd, 0.55));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(8, 14, 10);
        scene.add(dir);
        const fill = new THREE.PointLight(0xff8844, 0.3, 40);
        fill.position.set(-8, 2, -5);
        scene.add(fill);

        const g = new THREE.Group();
        buildTiers(g);
        addFrosting(g);
        addDecorations(g);
        addCandles(g);
        scene.add(g);
        cake = g;
        camera.position.set(0, 4, 14);
        animate();
        document
          .getElementById("start-mic-btn")
          .addEventListener("click", startMic);
      }

      function buildTiers(g) {
        [
          [5, 2.2, 0, 0xe0293f],
          [4, 2.2, 2.2, 0xec3a50],
          [3, 2.2, 4.4, 0xf94f63],
        ].forEach(([r, h, y, col]) => {
          const body = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, h, 48),
            new THREE.MeshPhongMaterial({ color: col, shininess: 50 }),
          );
          body.position.y = y + h / 2;
          g.add(body);
          // watermelon rind edge: white pith ring, then a green rind ring on top of it
          const pith = new THREE.Mesh(
            new THREE.TorusGeometry(r, 0.08, 10, 60),
            new THREE.MeshPhongMaterial({ color: 0xf7f5e6, shininess: 60 }),
          );
          pith.position.y = y + h - 0.14;
          pith.rotation.x = Math.PI / 2;
          g.add(pith);
          const rim = new THREE.Mesh(
            new THREE.TorusGeometry(r, 0.09, 10, 60),
            new THREE.MeshPhongMaterial({ color: 0x2f8f4e, shininess: 90 }),
          );
          rim.position.y = y + h;
          rim.rotation.x = Math.PI / 2;
          g.add(rim);
        });
      }

      function addFrosting(g) {
        [
          [14, 5, 2.2, 0.5],
          [11, 4, 4.4, 0.4],
          [8, 3, 6.6, 0.32],
        ].forEach(([n, r, y, sz]) => {
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            const b = new THREE.Mesh(
              new THREE.SphereGeometry(sz, 10, 10),
              new THREE.MeshPhongMaterial({ color: 0xfff5f0, shininess: 70 }),
            );
            b.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
            g.add(b);
          }
        });
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2;
          const b = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 10, 10),
            new THREE.MeshPhongMaterial({ color: 0xfff5f0, shininess: 70 }),
          );
          b.position.set(Math.cos(a) * 1.3, 6.8, Math.sin(a) * 1.3);
          g.add(b);
        }
        const tip = new THREE.Mesh(
          new THREE.SphereGeometry(0.65, 12, 12),
          new THREE.MeshPhongMaterial({ color: 0xfff5f0, shininess: 70 }),
        );
        tip.position.set(0, 6.9, 0);
        g.add(tip);
      }

      function addDecorations(g) {
        // watermelon seeds: small, dark, teardrop-flat, studded generously
        // across each red tier so they read clearly against the flesh.
        const seedMat = new THREE.MeshPhongMaterial({
          color: 0x1f0f08,
          shininess: 90,
        });
        [
          // r (tier radius), yBase (tier bottom), h (tier height), rows, perRow
          [5, 0, 2.2, 3, 12],
          [4, 2.2, 2.2, 3, 10],
          [3, 4.4, 2.2, 2, 9],
        ].forEach(([r, yBase, h, rows, perRow]) => {
          for (let row = 0; row < rows; row++) {
            const y = yBase + h * ((row + 0.5) / rows);
            const rowOffset = (row % 2) * (Math.PI / perRow); // stagger rows
            for (let i = 0; i < perRow; i++) {
              const a = (i / perRow) * Math.PI * 2 + rowOffset;
              const seed = new THREE.Mesh(
                new THREE.SphereGeometry(0.16, 8, 8),
                seedMat,
              );
              seed.scale.set(0.55, 1.15, 0.3);
              seed.position.set(
                Math.cos(a) * (r + 0.03),
                y,
                Math.sin(a) * (r + 0.03),
              );
              seed.rotation.y = -a;
              seed.rotation.z = (Math.random() - 0.5) * 0.6;
              g.add(seed);
            }
          }
        });
      }

      function addCandles(g) {
        const pos = [
          { x: 0, z: 0 },
          { x: 1.4, z: 0 },
          { x: -1.4, z: 0 },
          { x: 0, z: 1.4 },
          { x: 0, z: -1.4 },
        ];
        const cols = [0xff6b9d, 0xffb347, 0x7de0ff, 0xb48aff, 0x6dffd2];
        const baseY = 6.6;
        pos.forEach((p, i) => {
          const stick = new THREE.Mesh(
            new THREE.CylinderGeometry(0.13, 0.13, 1.1, 16),
            new THREE.MeshPhongMaterial({ color: cols[i], shininess: 60 }),
          );
          stick.position.set(p.x, baseY + 0.55, p.z);
          g.add(stick);

          const light = new THREE.PointLight(0xffdd55, 2.8, 9);
          light.position.set(p.x, baseY + 1.45, p.z);
          g.add(light);

          const flameOut = new THREE.Mesh(
            new THREE.ConeGeometry(0.22, 0.75, 16),
            new THREE.MeshPhongMaterial({
              color: 0xff8800,
              emissive: 0xff4400,
              emissiveIntensity: 1.4,
              transparent: true,
              opacity: 0.92,
            }),
          );
          flameOut.position.set(p.x, baseY + 1.45, p.z);
          g.add(flameOut);

          const flameIn = new THREE.Mesh(
            new THREE.ConeGeometry(0.1, 0.46, 12),
            new THREE.MeshPhongMaterial({
              color: 0xffff99,
              emissive: 0xffff00,
              emissiveIntensity: 2.2,
              transparent: true,
              opacity: 0.98,
            }),
          );
          flameIn.position.set(p.x, baseY + 1.52, p.z);
          g.add(flameIn);

          const glow = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 10, 10),
            new THREE.MeshPhongMaterial({
              color: 0xffff44,
              emissive: 0xffaa00,
              emissiveIntensity: 2,
              transparent: true,
              opacity: 0.65,
            }),
          );
          glow.position.set(p.x, baseY + 1.18, p.z);
          g.add(glow);

          candleMeshes.push({
            stick,
            flameOut,
            flameIn,
            glow,
            light,
            blown: false,
          });
        });
      }

      /* ---- animate loop ---- */
      function animate() {
        requestAnimationFrame(animate);
        const t = Date.now() * 0.005;
        cake.rotation.y += cakeBlown ? 0.016 : 0.004;

        candleMeshes.forEach((c, i) => {
          if (c.blown) return;
          c.flameOut.rotation.y += 0.07;
          c.flameOut.position.y += Math.sin(t * 3 + i * 0.9) * 0.001;
          c.flameOut.scale.x = 1 + Math.sin(t * 4 + i * 0.7) * 0.09;
          c.flameOut.scale.z = c.flameOut.scale.x;
          c.flameIn.position.y = c.flameOut.position.y + 0.07;
          c.light.intensity = 2.2 + Math.sin(t * 3 + i * 1.7) * 0.7;
        });

        if (micActive && analyser && !cakeBlown) {
          const lv = getMicLevel();
          document.getElementById("blow-meter-bar").style.width =
            lv * 100 + "%";
          const thr = blowThreshold();
          if (lv > thr) {
            blowHoldFrames++;
            if (blowHoldFrames >= HOLD_NEEDED) {
              blowHoldFrames = 0;
              extinguishOne();
            }
          } else {
            blowHoldFrames = Math.max(0, blowHoldFrames - 1);
          }
        }
        renderer.render(scene, camera);
      }

      /* ---- mic ---- */
      async function startMic() {
        /* Unlock audio playback NOW — we have a user gesture from the mic button click */
        const audio = document.getElementById("bday-audio");
        audio.volume = 0;
        audio
          .play()
          .then(() => {
            audio.pause();
            audio.currentTime = 0;
            audio.volume = 0.85;
          })
          .catch(() => {});

        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const src = audioCtx.createMediaStreamSource(micStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          src.connect(analyser);
          micActive = true;
          document.getElementById("start-mic-btn").classList.add("hidden");
          document.getElementById("blow-meter-wrap").classList.add("visible");
          document.getElementById("candle-count").classList.add("visible");
          updateCandleCount();
          document.getElementById("instructions").textContent =
            "🎂 Blow to snuff each candle! 🎂";
        } catch (e) {
          document.getElementById("instructions").textContent =
            "🎂 Click the cake to blow! 🎂";
          document.getElementById("start-mic-btn").classList.add("hidden");
          /* unlock audio on first cake click */
          const unlockAudio = () => {
            const a = document.getElementById("bday-audio");
            a.volume = 0;
            a.play()
              .then(() => {
                a.pause();
                a.currentTime = 0;
                a.volume = 0.85;
              })
              .catch(() => {});
          };
          renderer.domElement.addEventListener(
            "click",
            () => {
              unlockAudio();
              extinguishOne();
            },
            { once: true },
          );
          renderer.domElement.addEventListener("click", () => extinguishOne());
        }
      }
      function getMicLevel() {
        const buf = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(buf);
        return buf.reduce((a, b) => a + b, 0) / (buf.length * 255);
      }

      function updateCandleCount() {
        const el = document.getElementById("candle-count");
        if (candlesLeft > 0) {
          el.textContent = `🕯 ${candlesLeft} candle${candlesLeft > 1 ? "s" : ""} left — blow harder!`;
        }
      }

      /* ---- extinguish ONE candle per strong blow ---- */
      function extinguishOne() {
        /* find the first unblown candle */
        const c = candleMeshes.find((c) => !c.blown);
        if (!c) return;
        c.blown = true;
        c.flameOut.visible = false;
        c.flameIn.visible = false;
        c.glow.visible = false;

        /* smoke puff: quick scale-up then fade */
        c.light.intensity = 0;

        candlesLeft--;
        updateCandleCount();

        /* small shake on the cake */
        shakeCake();

        if (candlesLeft === 0) {
          /* tiny delay so last extinguish registers visually */
          setTimeout(() => allCandlesOut(), 400);
        } else {
          /* bump threshold feedback via meter color */
          const pct = Math.round(blowThreshold() * 100);
          document.getElementById("instructions").textContent =
            `💨 ${candlesLeft} left — need ${pct}%+ blow!`;
        }
      }

      let shakeTimeout;
      function shakeCake() {
        clearTimeout(shakeTimeout);
        cake.rotation.z = 0.04;
        shakeTimeout = setTimeout(() => {
          cake.rotation.z = 0;
        }, 120);
      }

      function allCandlesOut() {
        cakeBlown = true;
        document.getElementById("blow-ui").style.display = "none";
        document.getElementById("confetti-canvas").style.display = "block";
        createConfetti();
        document.getElementById("balloons").classList.add("visible");
        setTimeout(playBirthdaySong, 300);
        // fade the cake out so the character gets a clear stage
        setTimeout(() => {
          const canvas = document.getElementById("cake-canvas");
          canvas.style.transition = "opacity 1s ease";
          canvas.style.opacity = "0";
          setTimeout(() => {
            canvas.style.display = "none";
          }, 1050);
        }, 600);
        setTimeout(showCharacter, 1000);
        if (micStream) micStream.getTracks().forEach((t) => t.stop());
      }

      /* ============================================================
   MUSIC (MP3)
============================================================ */
      function playBirthdaySong() {
        const audio = document.getElementById("bday-audio");
        if (
          !audio.src ||
          audio.networkState === HTMLMediaElement.NETWORK_NO_SOURCE
        )
          return;
        audio.currentTime = 0;
        audio.volume = 0.85;
        audio.play().catch(() => {
          /* fallback: show play button if somehow still blocked */
          const btn = document.createElement("button");
          btn.textContent = "▶  Play Birthday Song";
          Object.assign(btn.style, {
            position: "fixed",
            bottom: "5%",
            left: "50%",
            transform: "translateX(-50%)",
            background: "rgba(0,0,0,.5)",
            backdropFilter: "blur(8px)",
            border: "1.5px solid rgba(255,200,100,.5)",
            color: "rgba(255,230,180,.95)",
            fontFamily: "'Inter',sans-serif",
            fontSize: "15px",
            padding: "11px 28px",
            borderRadius: "30px",
            cursor: "pointer",
            zIndex: "300",
          });
          document.body.appendChild(btn);
          btn.addEventListener(
            "click",
            () => {
              audio.play();
              btn.remove();
            },
            { once: true },
          );
        });
        const chip = document.getElementById("music-chip");
        chip.classList.add("show");
        audio.addEventListener(
          "ended",
          () => {
            chip.style.transition = "opacity .8s";
            chip.style.opacity = "0";
            setTimeout(() => {
              chip.classList.remove("show");
              chip.style.opacity = "";
            }, 850);
          },
          { once: true },
        );
      }

      /* ============================================================
   CHARACTER — eyebrow bob (CSS) + wink (canvas)
============================================================ */
      function showCharacter() {
        const wrap = document.getElementById("char-wrap");
        wrap.classList.add("visible");
        setTimeout(() => {
          document.getElementById("svg-guy-wrap").classList.add("dancing");
        }, 800);
      }

      /* ============================================================
   CONFETTI
============================================================ */
      function createConfetti() {
        const cv = document.getElementById("confetti-canvas");
        const cx = cv.getContext("2d");
        cv.width = innerWidth;
        cv.height = innerHeight;
        const cols = [
          "#ff4081",
          "#ff9e80",
          "#ffff8d",
          "#b9f6ca",
          "#80d8ff",
          "#ce93d8",
          "#f48fb1",
          "#fff176",
        ];
        const makePiece = (startAboveScreen) => ({
          x: Math.random() * cv.width,
          y: startAboveScreen
            ? -20 - Math.random() * cv.height
            : Math.random() * cv.height * 1.4 - cv.height * 0.4,
          w: Math.random() * 10 + 5,
          h: Math.random() * 5 + 3,
          color: cols[0 | (Math.random() * cols.length)],
          speed: Math.random() * 3 + 1.5,
          vx: (Math.random() - 0.5) * 1.6,
          rot: Math.random() * 360,
          rotV: Math.random() * 8 - 4,
        });
        const ps = Array.from({ length: 280 }, () => makePiece(false));
        (function draw() {
          cx.clearRect(0, 0, cv.width, cv.height);
          ps.forEach((p) => {
            cx.save();
            cx.translate(p.x, p.y);
            cx.rotate((p.rot * Math.PI) / 180);
            cx.fillStyle = p.color;
            cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            cx.restore();
            p.y += p.speed;
            p.x += p.vx;
            p.rot += p.rotV;
            // once a piece drifts off the bottom, recycle it back above
            // the screen so the shower keeps going forever
            if (p.y > cv.height + 10) {
              p.y = -20;
              p.x = Math.random() * cv.width;
              p.vx = (Math.random() - 0.5) * 1.6;
            }
          });
          requestAnimationFrame(draw);
        })();
      }

      window.addEventListener("resize", () => {
        if (!camera || !renderer) return;
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // Run immediately: by the time this inline script executes (it's at
      // the end of <body>), the DOM/canvas are already parsed and Three.js
      // (loaded via a blocking <script> in <head>) is already available.
      // The cake itself is built procedurally with no textures/models to
      // fetch, so there's no reason to wait for window.onload — which used
      // to stall rendering until every page resource (fonts, and especially
      // the eagerly-preloaded birthday.mp3) had fully downloaded.
      initCake();
    </script>
  </body>
</html>
